name: my_daily_routine
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  home_widget: ^0.10.0
  showcaseview: ^5.1.0
  image_picker: ^1.2.4
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/
    - lib/assets/avatar/
    - lib/assets/avatar/hairstyles/
    - lib/assets/avatar/faces/
    - lib/assets/background/
    - lib/assets/icons/
    - lib/assets/recursos/
    - lib/assets/davo_recursos/
  shaders:
    - shaders/avatar_colors.frag
